<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Art | Krish Makwana</title>
<meta name="description" content="Traditional and digital artwork by Krish Makwana: anime-inspired sketches, character art and illustration, in an image-first gallery.">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Krish Makwana">
<meta property="og:title" content="Art | Krish Makwana">
<meta property="og:description" content="Traditional and digital artwork by Krish Makwana: anime-inspired sketches, character art and illustration.">

<meta name="twitter:card" content="summary">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f2f2f7">
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/glass.css">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/gallery.css">
</head>
<body class="gallery-page">
<a class="skip" href="#gallery-root">Skip to content</a>

<header class="top">
  <div class="bar">
    <span class="bar-glass glass" data-glass="refract" aria-hidden="true"></span>
    <a href="/" class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="square" aria-hidden="true"><path d="M20 16v32M44 16L26 33l18 15"/></svg></span>Krish</a>
    <nav class="primary glass-strong" id="site-nav" aria-label="Main">
      <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/art/" aria-current="page">Art</a></li>
      <li><a href="/projects/">Projects</a></li>
      <li><a href="/resources/">Resources</a></li>
      <li><a href="/about/">About</a></li>
      <li><a href="/links/">Links</a></li>
      <li><a href="/contact/">Contact</a></li>
      </ul>
    </nav>
    <div class="bar-actions">
      <button class="icon-btn theme-toggle" data-theme-toggle type="button" aria-label="Toggle dark mode">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
      <button class="icon-btn nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
        <svg class="icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="gallery-root">

  <div class="g-head wrap-wide">
    <div>
      <h1 id="g-title">Gallery</h1>
      <div class="g-count" id="g-count" aria-live="polite"></div>
    </div>
    <div class="g-segmented glass" role="group" aria-label="View">
      <button type="button" id="seg-library" aria-pressed="true">Library</button>
      <button type="button" id="seg-collections" aria-pressed="false">Collections</button>
    </div>
  </div>

  <div class="g-toolbar-wrap">
    <div class="g-toolbar wrap-wide">
      <button type="button" id="g-back-btn" class="btn g-back" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        All
      </button>
      <label class="g-search glass">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="g-search-input" type="search" placeholder="Search artwork" aria-label="Search artwork" autocomplete="off" enterkeyhint="search">
      </label>
      <div class="g-actions">
        <button type="button" id="g-select-btn" class="btn" aria-pressed="false">Select</button>
      </div>
    </div>
  </div>

  <div class="g-body wrap-wide" id="g-body"></div>

  <div class="g-bottom-bar glass" id="g-bottom-bar" data-glass="refract" role="group" aria-label="Group by date">
    <button type="button" data-scope="years" aria-pressed="false">Years</button>
    <button type="button" data-scope="months" aria-pressed="false">Months</button>
    <button type="button" data-scope="all" aria-pressed="true">All</button>
  </div>

  <div class="g-bulk-bar glass" id="g-bulk-bar" data-glass="refract" role="toolbar" aria-label="Selection actions">
    <span class="g-bulk-count" id="g-bulk-count" aria-live="polite">0 selected</span>
    <button type="button" id="g-bulk-fav">Favorite</button>
    <button type="button" id="g-bulk-add">Add to Collection</button>
    <button type="button" id="g-bulk-cancel">Cancel</button>
  </div>

  <div class="g-viewer theme-dark" id="g-viewer" role="dialog" aria-modal="true" aria-label="Artwork viewer">
    <div class="g-viewer-top">
      <button type="button" id="g-viewer-close" class="g-vbtn glass" data-glass="refract" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="g-viewer-meta" id="g-viewer-sub"></div>
      <button type="button" id="g-viewer-fav" class="g-vbtn glass" data-glass="refract" aria-label="Favorite" aria-pressed="false"></button>
    </div>
    <div class="g-viewer-stage">
      <button type="button" class="g-vbtn g-viewer-nav prev glass" data-glass="refract" id="g-viewer-prev" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <img id="g-viewer-img" src="" alt="" draggable="false">
      <span class="spinner g-viewer-spinner" aria-hidden="true"></span>
      <button type="button" class="g-vbtn g-viewer-nav next glass" data-glass="refract" id="g-viewer-next" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="g-viewer-info glass-strong">
      <div class="title" id="g-viewer-title"></div>
      <div class="desc" id="g-viewer-desc"></div>
    </div>
  </div>

</main>

<footer class="foot">
  <div class="wrap-wide">
    <p>&copy; <span id="y">2026</span> Krish Makwana</p>
    <ul class="foot-links">
      <li><a href="/collaborate/">Collaborate</a></li>
      <li><a href="/support/">Support</a></li>
      <li><a href="/privacy/">Privacy</a></li>
      <li><a href="/terms/">Terms</a></li>
      <li><a href="/contact/">Contact</a></li>
    </ul>
  </div>
</footer>

<script src="/js/config.js"></script>
<script src="/js/site.js"></script>
<script src="/js/liquid-glass.js"></script>
<script src="/js/lenso-press.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/dialog.js"></script>
<script src="/js/gallery-data.js"></script>
<script src="/js/gallery.js"></script>
</body>
</html>
