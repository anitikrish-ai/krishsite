<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Art | Krish Makwana</title>
<meta name="description" content="Traditional and digital artwork by Krish Makwana — anime-inspired sketches, character art and illustration, in an image-first gallery.">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Krish Makwana">
<meta property="og:title" content="Art | Krish Makwana">
<meta property="og:description" content="Traditional and digital artwork by Krish Makwana — anime-inspired sketches, character art and illustration.">

<meta name="twitter:card" content="summary">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/gallery.css">
</head>
<body class="gallery-page">
<a class="skip" href="#gallery-root">Skip to content</a>

<div id="gallery-root">

  <header class="g-header">
    <div class="g-topbar glass">
      <a href="/" class="brand"><span class="mark">K</span>Krish</a>
      <nav class="primary" aria-label="Main">
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/art/" aria-current="page">Art</a></li>
          <li><a href="/projects/">Projects</a></li>
          <li><a href="/resources/">Resources</a></li>
          <li><a href="/about/">About</a></li>
          <li><a href="/links/">Links</a></li>
          <li><a href="/contact/">Contact</a></li>
        </ul>
      </nav>
      <button class="theme-toggle" data-theme-toggle type="button" aria-label="Toggle dark mode">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </div>

    <div class="g-title-row">
      <div>
        <h1 id="g-title">Gallery</h1>
        <div class="g-count" id="g-count"></div>
      </div>
      <div class="g-segmented glass">
        <button type="button" id="seg-library" aria-selected="true">Library</button>
        <button type="button" id="seg-collections" aria-selected="false">Collections</button>
      </div>
    </div>

    <div class="g-toolbar">
      <button type="button" id="g-back-btn" class="g-back" style="display:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
        All
      </button>
      <label class="g-search glass">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="g-search-input" type="search" placeholder="Search artwork" aria-label="Search artwork">
      </label>
      <div class="g-actions">
        <button type="button" id="g-select-btn" class="g-pill-btn" aria-pressed="false">Select</button>
      </div>
    </div>
  </header>

  <div class="g-body" id="g-body"></div>

  <div class="g-bottom-bar glass" id="g-bottom-bar">
    <button type="button" data-scope="years" aria-selected="false">Years</button>
    <button type="button" data-scope="months" aria-selected="false">Months</button>
    <button type="button" data-scope="all" aria-selected="true">All</button>
  </div>

  <div class="g-bulk-bar glass" id="g-bulk-bar">
    <span class="g-bulk-count" id="g-bulk-count">0 selected</span>
    <button type="button" id="g-bulk-fav">Favorite</button>
    <button type="button" id="g-bulk-add">Add to Collection</button>
    <button type="button" id="g-bulk-cancel">Cancel</button>
  </div>

  <div class="g-viewer" id="g-viewer" role="dialog" aria-modal="true" aria-label="Artwork viewer">
    <div class="g-viewer-top">
      <button type="button" id="g-viewer-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="g-viewer-meta" id="g-viewer-sub"></div>
      <button type="button" id="g-viewer-fav" aria-label="Favorite" aria-pressed="false"></button>
    </div>
    <div class="g-viewer-stage">
      <button type="button" class="g-viewer-nav prev" id="g-viewer-prev" aria-label="Previous">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <img id="g-viewer-img" src="" alt="" draggable="false">
      <button type="button" class="g-viewer-nav next" id="g-viewer-next" aria-label="Next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="g-viewer-info">
      <div class="title" id="g-viewer-title"></div>
      <div class="desc" id="g-viewer-desc"></div>
    </div>
  </div>

</div>

<script src="/js/config.js"></script>
<script src="/js/site.js"></script>
<script src="/js/gallery-data.js"></script>
<script src="/js/gallery.js"></script>
</body>
</html>
